# ==============================
# Docker 微服務作業 - Compose 檔案
# ==============================
# 服務清單：
# - db (postgres)  : 資料庫
# - api (node.js)  : 後端 API（REST）
# - analyzer (python): 文字分析服務（FastAPI）
# - nginx (web)    : 反向代理 + 靜態前端
# ==============================

services:
  # 1. PostgreSQL 資料庫
  db:
    image: postgres:16-alpine
    container_name: hw_db
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-admin}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-password123}
      POSTGRES_DB: ${POSTGRES_DB:-homework_db}
      TZ: Asia/Taipei
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
      - ./db/init.sql:/docker-entrypoint-initdb.d/init.sql:ro
    networks:
      - backend
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-admin} -d ${POSTGRES_DB:-homework_db}"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s

  # 2. Node.js API 微服務
  api:
    build:
      context: ./api
      dockerfile: Dockerfile
    container_name: hw_api
    restart: unless-stopped
    environment:
      NODE_ENV: production
      SERVICE_NAME: node-api
      APP_PORT: 3000
      DB_HOST: db
      DB_PORT: 5432
      DB_USER: ${POSTGRES_USER:-admin}
      DB_PASSWORD: ${POSTGRES_PASSWORD:-password123}
      DB_NAME: ${POSTGRES_DB:-homework_db}
    depends_on:
      db:
        condition: service_healthy
    networks:
      - backend
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://127.0.0.1:3000/api/health || exit 1"]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 20s

  # 3. Python 分析微服務（FastAPI + Uvicorn）
  analyzer:
    build:
      context: ./analyzer
      dockerfile: Dockerfile
    container_name: hw_analyzer
    restart: unless-stopped
    environment:
      SERVICE_NAME: python-analyzer
      APP_PORT: 8000
      TZ: Asia/Taipei
    networks:
      - backend
    healthcheck:
      test: ["CMD-SHELL", "python -c \"import urllib.request,sys; sys.exit(0 if urllib.request.urlopen('http://127.0.0.1:8000/health', timeout=4).status==200 else 1)\""]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 15s

  # 4. Nginx（反向代理 + 靜態網頁）
  nginx:
    build:
      context: ./nginx
      dockerfile: Dockerfile
    container_name: hw_nginx
    restart: unless-stopped
    ports:
      - "${NGINX_PORT:-80}:80"
    depends_on:
      api:
        condition: service_healthy
      analyzer:
        condition: service_healthy
    networks:
      - frontend
      - backend
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://127.0.0.1/healthz || exit 1"]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 10s

volumes:
  pgdata:

networks:
  frontend:
  backend:
