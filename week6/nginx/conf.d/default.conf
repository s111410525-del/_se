# 後端微服務的 upstream（服務名稱由 Docker Compose 的內部 DNS 解析）
upstream node_api {
    server api:3000;
}

upstream python_analyzer {
    server analyzer:8000;
}

server {
    listen 80;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    # 前端靜態網頁（找不到檔案就回首頁）
    location / {
        try_files $uri $uri/ /index.html;
    }

    # 靜態資源加上快取
    location ~* \.(css|js|png|jpg|jpeg|svg|ico|woff2?)$ {
        expires 7d;
        add_header Cache-Control "public";
        try_files $uri =404;
    }

    # Node.js API：/api/status -> http://api:3000/api/status
    location /api/ {
        proxy_pass http://node_api;
        proxy_http_version 1.1;
        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_connect_timeout 5s;
        proxy_read_timeout    30s;
    }

    # Python 分析服務：/py/analyze -> http://analyzer:8000/analyze
    location /py/ {
        proxy_pass http://python_analyzer/;
        proxy_http_version 1.1;
        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_connect_timeout 5s;
        proxy_read_timeout    30s;
    }

    # Nginx 自身的健康檢查端點
    location = /healthz {
        access_log off;
        add_header Content-Type text/plain;
        return 200 "ok\n";
    }
}
