<!doctype html>
<html lang="zh-Hant">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="color-scheme" content="light dark" />
    <meta name="theme-color" content="#f4efe4" media="(prefers-color-scheme: light)" />
    <meta name="theme-color" content="#14130f" media="(prefers-color-scheme: dark)" />
    <meta
      name="description"
      content="EdgeMemo：一個用 Cloudflare Workers 與 D1 打造的備忘錄網站，支援搜尋、色紙分類、釘選與即時編輯。"
    />
    <meta name="referrer" content="strict-origin-when-cross-origin" />
    <meta
      http-equiv="Content-Security-Policy"
      content="default-src 'self'; script-src 'self'; style-src 'self'; img-src 'self' data:; font-src 'self'; connect-src 'self'; base-uri 'none'; form-action 'self'"
    />
    <title>EdgeMemo · 我的備忘錄</title>
    <link rel="icon" href="/favicon.svg" type="image/svg+xml" />
    <link rel="stylesheet" href="/style.css" />
  </head>
  <body>
    <a class="skip-link" href="#main">跳到主要內容</a>

    <header class="site-header">
      <div class="wrap header-inner">
        <a class="brand" href="/">
          <svg class="brand-mark" viewBox="0 0 32 32" aria-hidden="true" focusable="false">
            <rect x="2" y="2" width="28" height="28" rx="9" fill="currentColor" />
            <path
              d="M10 11h12M10 16h12M10 21h8"
              stroke="var(--brand-ink)"
              stroke-width="2.2"
              stroke-linecap="round"
            />
          </svg>
          <span class="brand-text">
            <strong>EdgeMemo</strong>
            <small>備忘錄</small>
          </span>
        </a>

        <button class="button new-note" type="button" data-action="new">
          <svg viewBox="0 0 24 24" aria-hidden="true" focusable="false">
            <path d="M12 5v14M5 12h14" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" />
          </svg>
          <span>新增備忘錄</span>
        </button>
      </div>
    </header>

    <main id="main" class="wrap" tabindex="-1">
      <section class="page-head">
        <p class="eyebrow">PERSONAL MEMOS · CLOUDFLARE D1</p>
        <h1>把靈感留在<span>邊緣</span>。</h1>
        <p class="lede">
          一頁式的備忘錄牆。用色紙分類、把重要的釘在最前面，資料存在 Cloudflare D1，開啟就能寫。
        </p>
        <p class="stats" id="stats">載入中…</p>
      </section>

      <section class="toolbar" aria-label="搜尋與篩選">
        <div class="search-box">
          <svg class="search-icon" viewBox="0 0 24 24" aria-hidden="true" focusable="false">
            <circle cx="11" cy="11" r="6.5" fill="none" stroke="currentColor" stroke-width="1.9" />
            <path d="m16 16 4.2 4.2" stroke="currentColor" stroke-width="1.9" stroke-linecap="round" />
          </svg>
          <label class="sr-only" for="search">搜尋備忘錄</label>
          <input id="search" type="search" placeholder="搜尋標題或內容…" autocomplete="off" />
          <button id="clear-search" class="clear-search" type="button" aria-label="清除搜尋" hidden>
            <svg viewBox="0 0 24 24" aria-hidden="true" focusable="false">
              <path d="m7 7 10 10M17 7 7 17" stroke="currentColor" stroke-width="2" stroke-linecap="round" />
            </svg>
          </button>
        </div>

        <div class="filter-group" role="group" aria-label="篩選備忘錄">
          <button class="chip is-active" type="button" data-filter="all">全部</button>
          <button class="chip" type="button" data-filter="pinned">釘選</button>
        </div>

        <div class="color-filter" role="group" aria-label="依顏色篩選">
          <button class="color-dot all is-active" type="button" data-color="all" aria-label="所有顏色"></button>
          <button class="color-dot color-sand" type="button" data-color="sand" aria-label="沙色"></button>
          <button class="color-dot color-rose" type="button" data-color="rose" aria-label="玫瑰色"></button>
          <button class="color-dot color-mint" type="button" data-color="mint" aria-label="薄荷色"></button>
          <button class="color-dot color-sky" type="button" data-color="sky" aria-label="天空色"></button>
          <button class="color-dot color-lilac" type="button" data-color="lilac" aria-label="薰衣草色"></button>
          <button class="color-dot color-sun" type="button" data-color="sun" aria-label="日光色"></button>
        </div>
      </section>

      <section id="notes-region" aria-live="polite" aria-busy="true">
        <div class="loading" id="loading">
          <span class="spinner" aria-hidden="true"></span>
          載入備忘錄…
        </div>

        <div class="notes-grid" id="notes-grid"></div>

        <div class="empty" id="empty" hidden>
          <strong id="empty-title">還沒有任何備忘錄</strong>
          <p id="empty-text">把第一個想法寫下來，它會出現在這裡。</p>
          <button class="button" id="empty-action" type="button" data-action="new">新增備忘錄</button>
        </div>
      </section>
    </main>

    <footer class="site-footer">
      <div class="wrap footer-inner">
        <p>EdgeMemo · 用 Cloudflare Workers 與 D1 打造</p>
        <p class="footer-meta">
          <a href="https://developers.cloudflare.com/d1/" target="_blank" rel="noreferrer noopener">D1 文件</a>
        </p>
      </div>
    </footer>

    <dialog id="note-dialog" class="note-dialog" aria-labelledby="dialog-title">
      <form id="note-form" class="note-form" novalidate>
        <header class="dialog-head">
          <div>
            <p class="eyebrow">Memo</p>
            <h2 id="dialog-title">新增備忘錄</h2>
          </div>
          <button class="icon-button" type="button" data-close aria-label="關閉">
            <svg viewBox="0 0 24 24" aria-hidden="true" focusable="false">
              <path d="m7 7 10 10M17 7 7 17" stroke="currentColor" stroke-width="2" stroke-linecap="round" />
            </svg>
          </button>
        </header>

        <div class="dialog-body">
          <label class="sr-only" for="note-title">標題</label>
          <input
            id="note-title"
            class="title-input"
            type="text"
            maxlength="120"
            placeholder="備忘錄標題"
            autocomplete="off"
          />

          <div class="color-picker" role="group" aria-label="選擇色紙">
            <button class="swatch color-sand" type="button" data-color="sand" aria-label="沙色" aria-pressed="true"></button>
            <button class="swatch color-rose" type="button" data-color="rose" aria-label="玫瑰色" aria-pressed="false"></button>
            <button class="swatch color-mint" type="button" data-color="mint" aria-label="薄荷色" aria-pressed="false"></button>
            <button class="swatch color-sky" type="button" data-color="sky" aria-label="天空色" aria-pressed="false"></button>
            <button class="swatch color-lilac" type="button" data-color="lilac" aria-label="薰衣草色" aria-pressed="false"></button>
            <button class="swatch color-sun" type="button" data-color="sun" aria-label="日光色" aria-pressed="false"></button>
          </div>

          <label class="sr-only" for="note-content">內容</label>
          <textarea
            id="note-content"
            class="content-input"
            rows="10"
            maxlength="20000"
            placeholder="寫下想法、清單、待辦，或任何不想忘記的事…"
          ></textarea>

          <div class="editor-meta">
            <label class="pin-check">
              <input id="note-pinned" type="checkbox" />
              <span>釘選在最前面</span>
            </label>
            <span id="note-counter" class="counter">0 / 20000</span>
          </div>

          <p id="editor-error" class="editor-error" role="alert"></p>
        </div>

        <footer class="dialog-foot" id="dialog-foot">
          <button class="button danger ghost" id="note-delete" type="button">刪除</button>
          <div class="dialog-actions">
            <button class="button ghost" type="button" data-close>取消</button>
            <button class="button" id="note-save" type="submit">儲存</button>
          </div>
        </footer>

        <div class="delete-confirm" id="delete-confirm" hidden>
          <p>確定要刪除這則備忘錄嗎？此動作無法復原。</p>
          <div class="dialog-actions">
            <button class="button ghost" type="button" id="delete-cancel">取消</button>
            <button class="button danger" type="button" id="delete-confirm-button">確定刪除</button>
          </div>
        </div>
      </form>
    </dialog>

    <div id="toast" class="toast" role="status" aria-live="polite" hidden></div>

    <noscript>
      <p class="noscript">這個網站需要 JavaScript 才能載入與編輯備忘錄。</p>
    </noscript>

    <script src="/app.js" type="module"></script>
  </body>
</html>
